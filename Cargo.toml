[package]
name = "wrapperize"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
argh = "0.1.14"
color-eyre = { version = "0.6.5", default-features = false }
indoc = "2.0.7"
strum = { version = "0.28.0", features = ["derive"] }
tap = "1.0.1"
thiserror = "2.0.18"
